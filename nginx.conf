server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # the build hashes these filenames, so they can be cached for good
  location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # the mock data is not hashed, do not let it go stale
  location = /launches.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # angular routes: /launch/5 has to reach index.html instead of a 404
  location / {
    try_files $uri $uri/ /index.html;
  }
}
